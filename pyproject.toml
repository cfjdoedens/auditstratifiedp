[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auditstratified"
version = "0.1.5"
authors = [
    {name = "Crist-Jan Doedens", email = "auditstratified_python@chance-matters.nl"}, 
]
description = "Gestratificeerde steekproefaudits voor de Rijksoverheid (HARo-compatibel)"
readme = "README.md"
license = "EUPL-1.2"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Accounting",
]
keywords = ["audit", "sampling", "stratified", "HARo", "government"]
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "scipy>=1.7",
    "matplotlib>=3.4",
    "streamlit>=1.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
]

[project.urls]
"Bug Reports" = "https://github.com/cfjdoedens/auditstratifiedp/issues"
"Source" = "https://github.com/cfjdoedens/auditstratifiedp"
"Demo" = "https://auditstratifiedp-ko3vmnx8pfjkuf8xacb8kx.streamlit.app/"

[tool.setuptools.packages.find]
where = ["."]
include = ["auditstratified*"]
