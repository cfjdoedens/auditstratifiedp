name: Publish to PyPI

on:
  push:
    tags:
      - 'v*' # Start de workflow wanneer een tag die begint met 'v' wordt gepusht.

jobs:
  # Eerst testen.
  test:
    name: Run tests before publishing
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies and dev extras (includes pytest)
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run pytest
      run: python -m pytest


  # Publish.
  deploy:
    name: Build and publish to PyPI
    needs: test  # Wacht tot test groen is.
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/auditstratified

    # Vereist voor de beveiligde OIDC-koppeling met PyPI.
    permissions:
      id-token: write

    steps:
    # Haal de code op van de repository.
    - name: Checkout repository
      uses: actions/checkout@v4

    # Installeer Python en de benodigde hulpprogramma's.
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Upgrade pip and install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build

    # Bouw de distributiepakketten (wheel en sdist).
    - name: Build package
      run: python -m build

    # Publiceer het pakket automatisch naar PyPI via Trusted Publishing.
    - name: Publish package to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
