name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: "Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip and install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test package import
        run: |
          python -c "
          from auditstat.stratified.eval_stratified import eval_stratified
          from auditstat.stratified.plan_stratified import plan_stratified
          from auditstat.stratified.plot_kanskromme import plot_kanskromme
          from auditstat.stratified.utils import haro_nog_nodige_zekerheid, foutloze_posten_equivalent
          print('Alle imports geslaagd.')
          "

      - name: Lint with ruff
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest
